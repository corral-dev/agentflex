[package]
name = "agentflex"
version = "0.3.1"
edition = "2021"
license = "MIT"
description = "Animated, shareable card of your coding-agent week"
repository = "https://github.com/corral-dev/agentflex"
rust-version = "1.85"

[dependencies]
# Pinned SessKit commit; bump deliberately (AGENTS.md "Hard constraints").
sesskit-stats = { git = "https://github.com/x0c/sesskit", rev = "3507a8e0f4da1b08735343bd00421d51a1d70468" }
crossterm = "0.28"
flate2 = "1"
serde_json = "1"
sys-locale = "0.3"
time = { version = "0.3", features = ["local-offset", "formatting", "macros"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
