[package]
name = "agentflex"
version = "0.3.2"
edition = "2021"
license = "MIT"
description = "Animated, shareable card of your coding-agent week"
repository = "https://github.com/corral-dev/agentflex"
rust-version = "1.85"

[dependencies]
# Pinned SessKit commit; bump deliberately (AGENTS.md "Hard constraints").
sesskit-stats = { git = "https://github.com/x0c/sesskit", rev = "329b23371ab8cc8e421de2d2c455471590e434b9" }
crossterm = "0.28"
flate2 = "1"
serde_json = "1"
sys-locale = "0.3"
time = { version = "0.3", features = ["local-offset", "formatting", "macros"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
