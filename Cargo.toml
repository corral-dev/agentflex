[package]
name = "agentflex"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Animated, shareable card of your coding-agent week"
repository = "https://github.com/corral-dev/agentflex"
rust-version = "1.85"

[dependencies]
# Pinned SessKit commit; bump deliberately (AGENTS.md "Hard constraints").
sesskit-stats = { git = "https://github.com/x0c/sesskit", rev = "d8be617a15a1fa7a213c257d6e85959bd0fc4512" }
crossterm = "0.28"
flate2 = "1"
serde_json = "1"
time = { version = "0.3", features = ["local-offset", "formatting", "macros"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
