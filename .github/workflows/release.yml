# Builds the agentflex Rust binary for six targets and publishes the npm
# platform packages on version tags.
#
# Layout note: sesskit-stats is a git dependency pinned by `rev` in
# Cargo.toml, so the release builds exactly the reviewed SessKit commit.
# AgentFlex is checked out under $GITHUB_WORKSPACE/AgentFlex and every cargo
# step runs with working-directory AgentFlex.
#
# Linux choice: x86_64/aarch64-unknown-linux-musl targets produce fully
# static binaries (musl libc linked in, no glibc dependency), so the same
# artifact runs on any distro regardless of the runner's glibc version.
# Native runners are used for every target (macos-15 = arm64, macos-15-intel =
# x64, ubuntu-24.04-arm = arm64, windows-11-arm = arm64) instead of
# cross-compilation, avoiding cross toolchains and emulation.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# `id-token: write` is required for `npm publish --provenance` (Sigstore).
# `contents: write` uploads the six prebuilt binaries to the tag's GitHub
# release (Homebrew and curl installs download from there).
permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            exe: agentflex
            asset: aarch64-apple-darwin
          # NOTE: macos-13 (last Ventura x64 label) is retired on GitHub-hosted
          # runners (actionlint: unknown label); macos-15-intel is the
          # current x64 macOS runner.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            exe: agentflex
            asset: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            exe: agentflex
            asset: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            exe: agentflex
            asset: aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: agentflex.exe
            asset: x86_64-pc-windows-msvc.exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            exe: agentflex.exe
            asset: aarch64-pc-windows-msvc.exe
    defaults:
      run:
        working-directory: AgentFlex
        shell: bash
    steps:
      - name: Check out AgentFlex
        uses: actions/checkout@v4
        with:
          path: AgentFlex

      - name: Install musl tools (Linux static builds)
        if: endsWith(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary under canonical name
        run: |
          mkdir -p dist-bins
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "dist-bins/${{ matrix.asset }}"

      # Each runner is native to its target, so this executes every binary
      # (including Windows and Linux arm64) on real hardware of that architecture.
      - name: Smoke-test the binary on its own architecture
        run: |
          bin="target/${{ matrix.target }}/release/${{ matrix.exe }}"
          "$bin" --version
          "$bin" --json > smoke.json
          "$bin" --png smoke.png
          test -s smoke.png
          head -c 160 smoke.json; echo

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: AgentFlex/dist-bins/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish npm packages
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: AgentFlex
        shell: bash
    steps:
      - name: Check out AgentFlex (packaging scripts)
        uses: actions/checkout@v4
        with:
          path: AgentFlex

      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: AgentFlex/bins
          merge-multiple: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check tag matches Cargo.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          echo "tag: $tag_version, Cargo.toml: $cargo_version"
          test "$tag_version" = "$cargo_version" || { echo "error: tag v$tag_version does not match Cargo.toml version $cargo_version"; exit 1; }

      - name: Assemble npm packages
        run: node scripts/build-npm.mjs --version "${GITHUB_REF_NAME#v}" --bin-dir bins

      # The tag release carries the six prebuilt binaries (Homebrew and
      # curl installs download from there; npm alone is not enough).
      # Upload before npm publish so an npm auth failure never leaves
      # flex.sh or Homebrew without release binaries; created on demand so
      # a rerun never fails on an existing release.
      - name: Upload binaries to the GitHub release
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir -p release-assets
          for f in bins/*; do
            cp "$f" "release-assets/agentflex-$(basename "$f")"
          done
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "agentflex ${tag#v}" --generate-notes
          fi
          gh release upload "$tag" release-assets/agentflex-* --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      # Platform packages first, the launcher last, so the launcher never points
      # at versions that are not on the registry. Versions already published
      # (for example by an interrupted run) are skipped, so reruns are safe.
      # Windows packages are named `windows-*`: names containing `win32` are
      # rejected by npm's spam detection (verified 2026-11-04).
      - name: Publish to npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          for pkg in agentflex-darwin-arm64 agentflex-darwin-x64 agentflex-linux-x64 agentflex-linux-arm64 agentflex-windows-x64 agentflex-windows-arm64 agentflex; do
            if npm view "$pkg@$version" version >/dev/null 2>&1; then
              echo "skip $pkg@$version (already published)"
              continue
            fi
            npm publish --provenance --access public "npm/dist/$pkg"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
