# Continuous integration: build + test on all three OSes for pushes and PRs.
# Tag pushes are excluded (the release workflow covers those).
# sesskit-stats is a git dependency pinned by `rev` in Cargo.toml, so Cargo
# fetches the reviewed SessKit commit itself; no second checkout is needed.
name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-latest]
    defaults:
      run:
        working-directory: AgentFlex
        shell: bash
    steps:
      - name: Check out AgentFlex
        uses: actions/checkout@v4
        with:
          path: AgentFlex

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Check packaging script
        run: |
          node --check scripts/build-npm.mjs
          node scripts/build-npm.mjs --help
